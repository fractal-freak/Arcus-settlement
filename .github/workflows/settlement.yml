name: settlement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test sim/*.test.mjs
      - run: node sim/verify.mjs
      - name: Prepare original castle on the same runner
        run: |
          mkdir -p .local/comparison/saved
          cp src/three/realm3d.js src/three/gatehouse3d.js .local/comparison/saved/
          git show 52d8da642e26cec9fb815a781f7e83d563a9899f:src/three/realm3d.js > src/three/realm3d.js
          git show 52d8da642e26cec9fb815a781f7e83d563a9899f:src/three/gatehouse3d.js > src/three/gatehouse3d.js
          npm run build
          cp state/report.json .local/comparison/before-report.json
          cp state/report.json .local/comparison/after-report.json
      - name: Original geometry
        continue-on-error: true
        env:
          CRITIC_REPORT: .local/comparison/before-report.json
          CRITIC_SHOT: .local/comparison/before.png
        run: node sim/shoot.mjs 2>&1 | tee .local/comparison/before.log
      - name: Prepare indexed candidate
        run: |
          cp .local/comparison/saved/*.js src/three/
          npm run build
      - name: Indexed geometry
        continue-on-error: true
        env:
          CRITIC_REPORT: .local/comparison/after-report.json
          CRITIC_SHOT: .local/comparison/after.png
        run: node sim/shoot.mjs 2>&1 | tee .local/comparison/after.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: castle-geometry-comparison
          path: .local/comparison
