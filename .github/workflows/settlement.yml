name: settlement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test sim/*.test.mjs
      - run: node sim/verify.mjs
      - run: npm run build
      - name: Verify completed frames and real screenshot
        run: node sim/shoot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-world-capture
          path: |
            state/world.png
            state/report.json
