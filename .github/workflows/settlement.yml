name: settlement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: shell
            channel: ''
            capture: ''
          - variant: modern
            channel: chromium
            capture: ''
          - variant: buffered
            channel: ''
            capture: buffer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test sim/*.test.mjs
      - run: node sim/verify.mjs
      - run: npm run build
      - name: Capture actual world with unchanged quality gates
        env:
          WORLD_BROWSER_CHANNEL: ${{ matrix.channel }}
          WORLD_CAPTURE: ${{ matrix.capture }}
          CRITIC_REPORT: .local/render-diagnostic/report.json
          CRITIC_SHOT: .local/render-diagnostic/opening.png
        run: |
          mkdir -p .local/render-diagnostic
          cp state/report.json .local/render-diagnostic/report.json
          node sim/shoot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ matrix.variant }}
          path: .local/render-diagnostic
